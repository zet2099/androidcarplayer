<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarQueue - Real-time Jukebox</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind Configuration & Custom Styles -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },
                        brand: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #030712; color: #fff; overflow-x: hidden; }
        .glass-panel { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        /* Hidden YT Player for Host optimization */
        #yt-player-container { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- INITIALIZATION OVERLAY -->
    <div id="init-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950">
        <div class="text-center p-8 glass-panel rounded-2xl max-w-sm w-full mx-4">
            <i class="fa-solid fa-car-side text-6xl text-brand-500 mb-4"></i>
            <h1 class="text-2xl font-bold mb-2">CarQueue Setup</h1>
            <p id="init-status" class="text-gray-400 mb-6">Initializing network...</p>
            <button id="start-btn" class="hidden w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-brand-500/30">
                Start System
            </button>
        </div>
    </div>

    <!-- HOST VIEW (Car Head Unit) -->
    <div id="host-view" class="hidden h-full w-full flex flex-row">
        <!-- Left: Player Control & Now Playing -->
        <div class="flex-1 flex flex-col p-8 relative">
            <div class="flex justify-between items-start">
                <div>
                    <h2 class="text-brand-500 font-bold tracking-widest uppercase text-sm mb-1">Now Playing</h2>
                    <h1 class="text-4xl font-extrabold truncate w-[32rem]" id="host-title">Not Playing</h1>
                    <p class="text-gray-400 text-lg mt-1" id="host-artist">Waiting for tracks...</p>
                </div>
                <!-- Mini QR Code -->
                <div class="glass-panel p-3 rounded-xl flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-xs text-gray-400 uppercase tracking-wide">Scan to Queue</p>
                        <p class="text-sm font-bold text-brand-500" id="host-room-id-display"></p>
                    </div>
                    <div id="host-mini-qr" class="bg-white p-1 rounded"></div>
                </div>
            </div>

            <!-- Album Art Large -->
            <div class="flex-1 flex items-center justify-center py-8">
                <img id="host-thumbnail" src="https://via.placeholder.com/600x600/1f2937/4b5563?text=CarQueue" 
                     class="w-80 h-80 object-cover rounded-3xl shadow-2xl shadow-brand-500/20 border border-gray-800 transition-all duration-500">
            </div>

            <!-- Controls & Progress -->
            <div class="mt-auto glass-panel p-6 rounded-2xl">
                <!-- Progress Bar -->
                <div class="w-full bg-gray-800 rounded-full h-2 mb-4 relative cursor-pointer" id="progress-container">
                    <div class="bg-brand-500 h-2 rounded-full w-0 transition-all duration-300" id="host-progress-bar"></div>
                </div>
                <div class="flex justify-between text-xs text-gray-400 mb-4 font-mono">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
                
                <!-- Buttons -->
                <div class="flex items-center justify-center gap-8">
                    <button class="text-gray-400 hover:text-white transition" onclick="clearQueue()" title="Clear Queue"><i class="fa-solid fa-trash"></i></button>
                    <button class="text-3xl text-gray-300 hover:text-white transition" onclick="togglePlay()"><i class="fa-solid fa-play" id="btn-play-icon"></i></button>
                    <button class="text-3xl text-gray-300 hover:text-white transition" onclick="playNext()"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
        </div>

        <!-- Right: Up Next Sidebar -->
        <div class="w-96 glass-panel border-l border-gray-800 flex flex-col">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-list-ul mr-2 text-brand-500"></i> Up Next</h3>
                <span class="bg-brand-600/20 text-brand-400 text-xs px-2 py-1 rounded-full" id="queue-count">0 tracks</span>
            </div>
            <div class="flex-1 overflow-y-auto hide-scroll p-4 space-y-3" id="host-queue-list">
                <div class="text-center text-gray-500 mt-10 text-sm italic">Queue is empty</div>
            </div>
        </div>
        
        <!-- Hidden YT Player -->
        <div id="yt-player-container"><div id="yt-player"></div></div>
    </div>

    <!-- GUEST VIEW (Mobile Passenger) -->
    <div id="guest-view" class="hidden h-full w-full flex flex-col bg-gray-950">
        <!-- Status Bar -->
        <div class="bg-gray-900 px-4 py-2 flex justify-between items-center text-xs border-b border-gray-800">
            <span class="flex items-center text-emerald-400"><i class="fa-solid fa-circle text-[8px] mr-2 blink"></i> Connected to Car</span>
            <span class="text-gray-500 font-mono" id="guest-room-id"></span>
        </div>

        <!-- Now Playing Sticky Header -->
        <div class="glass-panel p-4 flex items-center gap-4 z-10 sticky top-0 shadow-lg">
            <img id="guest-np-thumb" src="https://via.placeholder.com/100" class="w-14 h-14 rounded-lg object-cover bg-gray-800">
            <div class="flex-1 min-w-0">
                <p class="text-xs text-brand-400 font-bold uppercase tracking-wider mb-1">Now Playing</p>
                <p class="font-bold truncate text-sm" id="guest-np-title">Nothing playing</p>
                <p class="text-xs text-gray-400 truncate" id="guest-np-artist">...</p>
            </div>
        </div>

        <!-- Search Area -->
        <div class="p-4 flex-shrink-0">
            <form id="search-form" class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-500"></i>
                <input type="text" id="search-input" placeholder="Search song or artist..." 
                       class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block pl-10 p-3 transition" required>
                <button type="submit" class="absolute right-2 top-2 bg-brand-600 hover:bg-brand-500 p-1.5 rounded-lg text-white">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Search Results List -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 pb-24 hide-scroll" id="guest-search-results">
            <div class="text-center text-gray-500 mt-10 text-sm">
                <i class="fa-brands fa-youtube text-4xl mb-3 text-gray-700"></i><br>
                Search for a track to add to the queue.
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script>
        // App State
        let isHost = false;
        let roomId = new URLSearchParams(window.location.search).get('room');
        
        let peer = null;
        let connections = [];     // Host: Connected guests
        let hostConnection = null; // Guest: Connection to host
        
        let queue = [];
        let currentTrack = null;
        let isPlaying = false;
        
        let ytPlayer = null;
        let progressInterval = null;

        // Fallback Instances Arrays
        const PIPED_INSTANCES = [
            'https://pipedapi.kavin.rocks',
            'https://api.piped.video',
            'https://pipedapi.tokhmi.xyz',
            'https://piped-api.garudalinux.org',
            'https://pipedapi.drgns.space',
            'https://pipedapi.mha.fi'
        ];

        const INVIDIOUS_INSTANCES = [
            'https://invidious.nerdvpn.de',
            'https://inv.tux.pizza',
            'https://invidious.drgns.space',
            'https://vid.puffyan.us'
        ];

        // Helper: Fetch with Timeout to prevent requests from hanging
        async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        // Helper: HTML Sanitization
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            isHost = !roomId;
            const startBtn = document.getElementById('start-btn');
            const initStatus = document.getElementById('init-status');

            if (isHost) {
                roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
                initStatus.innerText = "Ready to start Host environment.";
                startBtn.classList.remove('hidden');
                startBtn.onclick = () => {
                    document.getElementById('init-overlay').classList.add('hidden');
                    initHost();
                };
            } else {
                initStatus.innerText = "Connecting to Car...";
                startBtn.innerText = "Join Queue";
                startBtn.classList.remove('hidden');
                startBtn.onclick = () => {
                    document.getElementById('init-overlay').classList.add('hidden');
                    initGuest();
                };
            }
        });

        // --- HOST LOGIC ---
        function initHost() {
            document.getElementById('host-view').classList.remove('hidden');
            document.getElementById('host-room-id-display').innerText = roomId;
            
            // Generate QR Code
            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            new QRCode(document.getElementById("host-mini-qr"), {
                text: joinUrl,
                width: 90, height: 90,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });

            // Initialize PeerJS
            peer = new Peer(roomId);
            peer.on('open', (id) => console.log('Host Peer ID:', id));
            
            peer.on('connection', (conn) => {
                connections.push(conn);
                conn.on('data', (data) => handleHostData(data, conn));
                conn.on('close', () => connections = connections.filter(c => c !== conn));
                
                setTimeout(() => broadcastState(), 500); 
            });

            // Load YouTube API
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '1', width: '1',
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'playsinline': 1 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log("YouTube Player Ready");
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('btn-play-icon').classList.replace('fa-play', 'fa-pause');
                startProgressSync();
            } else {
                isPlaying = false;
                document.getElementById('btn-play-icon').classList.replace('fa-pause', 'fa-play');
                clearInterval(progressInterval);
            }

            if (event.data === YT.PlayerState.ENDED) {
                playNext();
            }
            broadcastState();
        }

        function handleHostData(data, conn) {
            if (data.type === 'ADD_QUEUE') {
                queue.push(data.track);
                if (!currentTrack) playNext();
                else broadcastState();
                renderHostQueue();
            }
        }

        function playNext() {
            if (queue.length === 0) {
                currentTrack = null;
                ytPlayer.stopVideo();
                updateHostUI();
                broadcastState();
                return;
            }
            currentTrack = queue.shift();
            ytPlayer.loadVideoById(currentTrack.videoId);
            updateHostUI();
            renderHostQueue();
            broadcastState();
        }

        function togglePlay() {
            if (!currentTrack && queue.length > 0) return playNext();
            if (!currentTrack) return;
            
            if (isPlaying) ytPlayer.pauseVideo();
            else ytPlayer.playVideo();
        }

        function clearQueue() {
            queue = [];
            renderHostQueue();
            broadcastState();
        }

        function updateHostUI() {
            const titleEl = document.getElementById('host-title');
            const artistEl = document.getElementById('host-artist');
            const thumbEl = document.getElementById('host-thumbnail');
            
            if (currentTrack) {
                titleEl.innerText = currentTrack.title;
                artistEl.innerText = currentTrack.artist;
                thumbEl.src = currentTrack.thumbnail.replace('hqdefault', 'maxresdefault');
            } else {
                titleEl.innerText = "Not Playing";
                artistEl.innerText = "Queue is empty";
                thumbEl.src = "https://via.placeholder.com/600x600/1f2937/4b5563?text=CarQueue";
                document.getElementById('host-progress-bar').style.width = '0%';
                document.getElementById('time-current').innerText = "0:00";
                document.getElementById('time-total').innerText = "0:00";
            }
        }

        function renderHostQueue() {
            const list = document.getElementById('host-queue-list');
            document.getElementById('queue-count').innerText = `${queue.length} tracks`;
            
            if (queue.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-500 mt-10 text-sm italic">Queue is empty</div>';
                return;
            }
            
            list.innerHTML = queue.map((track, i) => `
                <div class="flex items-center gap-3 bg-gray-800/50 p-2 rounded-lg border border-gray-700/50">
                    <div class="text-gray-500 text-xs font-mono w-4 text-center">${i + 1}</div>
                    <img src="${track.thumbnail}" class="w-10 h-10 rounded object-cover">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold truncate text-white">${escapeHtml(track.title)}</p>
                        <p class="text-xs text-gray-400 truncate">${escapeHtml(track.artist)}</p>
                    </div>
                </div>
            `).join('');
        }

        function formatTime(seconds) {
            if (!seconds) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function startProgressSync() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (ytPlayer && isPlaying) {
                    const current = ytPlayer.getCurrentTime();
                    const total = ytPlayer.getDuration();
                    const percent = (current / total) * 100;
                    
                    document.getElementById('host-progress-bar').style.width = `${percent}%`;
                    document.getElementById('time-current').innerText = formatTime(current);
                    document.getElementById('time-total').innerText = formatTime(total);
                }
            }, 1000);
        }

        function broadcastState() {
            const state = {
                type: 'STATE_UPDATE',
                currentTrack: currentTrack,
                isPlaying: isPlaying,
                queueLength: queue.length
            };
            connections.forEach(conn => conn.send(state));
        }

        // --- GUEST LOGIC ---
        function initGuest() {
            document.getElementById('guest-view').classList.remove('hidden');
            document.getElementById('guest-room-id').innerText = `ID: ${roomId}`;
            
            peer = new Peer();
            
            peer.on('open', (id) => {
                hostConnection = peer.connect(roomId);
                
                hostConnection.on('open', () => {
                    console.log("Connected to Host!");
                });
                
                hostConnection.on('data', (data) => {
                    if (data.type === 'STATE_UPDATE') {
                        updateGuestNP(data);
                    }
                });

                hostConnection.on('close', () => alert("Disconnected from Car."));
            });
            
            document.getElementById('search-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const q = document.getElementById('search-input').value;
                if (!q) return;
                performSearch(q);
            });
        }

        function updateGuestNP(data) {
            const thumb = document.getElementById('guest-np-thumb');
            const title = document.getElementById('guest-np-title');
            const artist = document.getElementById('guest-np-artist');

            if (data.currentTrack) {
                thumb.src = data.currentTrack.thumbnail;
                title.innerText = data.currentTrack.title;
                artist.innerText = data.currentTrack.artist;
            } else {
                thumb.src = "https://via.placeholder.com/100?text=None";
                title.innerText = "Nothing playing";
                artist.innerText = "...";
            }
        }

        // MULTI-PROVIDER SEARCH LOGIC WITH AUTOMATIC FALLBACK
        async function performSearch(query) {
            const resultsContainer = document.getElementById('guest-search-results');
            resultsContainer.innerHTML = `
                <div class="text-center text-brand-400 mt-10">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl"></i>
                    <p class="text-xs text-gray-400 mt-3">Searching across music providers...</p>
                </div>`;
            
            const encodedQuery = encodeURIComponent(query);
            let normalizedResults = null;

            // Step 1: Iterate through Piped API instances
            for (const instance of PIPED_INSTANCES) {
                try {
                    const res = await fetchWithTimeout(`${instance}/search?q=${encodedQuery}&filter=music_songs`, {}, 3500);
                    if (!res.ok) continue;
                    const data = await res.json();
                    
                    if (data && data.items && Array.isArray(data.items)) {
                        const streams = data.items.filter(i => i.type === 'stream');
                        if (streams.length > 0) {
                            normalizedResults = streams.map(item => {
                                const vId = item.url ? item.url.replace('/watch?v=', '') : '';
                                return {
                                    videoId: vId,
                                    title: item.title || 'Unknown Title',
                                    artist: item.uploaderName || 'Unknown Artist',
                                    thumbnail: item.thumbnail || `https://i.ytimg.com/vi/${vId}/hqdefault.jpg`
                                };
                            }).filter(item => item.videoId);

                            if (normalizedResults.length > 0) break; // Successfully fetched from Piped
                        }
                    }
                } catch (err) {
                    console.warn(`Piped instance failed (${instance}):`, err.message);
                }
            }

            // Step 2: Fallback to Invidious API instances if Piped fails
            if (!normalizedResults || normalizedResults.length === 0) {
                for (const instance of INVIDIOUS_INSTANCES) {
                    try {
                        const res = await fetchWithTimeout(`${instance}/api/v1/search?q=${encodedQuery}&type=video`, {}, 3500);
                        if (!res.ok) continue;
                        const data = await res.json();
                        
                        if (Array.isArray(data) && data.length > 0) {
                            const videos = data.filter(i => i.type === 'video' || i.videoId);
                            if (videos.length > 0) {
                                normalizedResults = videos.map(item => {
                                    let thumb = `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`;
                                    if (item.videoThumbnails && item.videoThumbnails.length > 0) {
                                        thumb = item.videoThumbnails[0].url;
                                    }
                                    return {
                                        videoId: item.videoId,
                                        title: item.title || 'Unknown Title',
                                        artist: item.author || item.uploaderName || 'Unknown Artist',
                                        thumbnail: thumb
                                    };
                                }).filter(item => item.videoId);

                                if (normalizedResults.length > 0) break; // Successfully fetched from Invidious
                            }
                        }
                    } catch (err) {
                        console.warn(`Invidious instance failed (${instance}):`, err.message);
                    }
                }
            }

            // Step 3: Handle All Failures
            if (!normalizedResults || normalizedResults.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="text-center mt-10">
                        <i class="fa-solid fa-triangle-exclamation text-red-400 text-3xl mb-2"></i>
                        <p class="text-gray-400 text-sm">All search providers are currently unreachable.<br>Please try again shortly.</p>
                    </div>`;
                return;
            }

            // Step 4: Render Normalized Search Results
            const items = normalizedResults.slice(0, 15);
            resultsContainer.innerHTML = items.map(item => `
                <div class="flex items-center gap-3 p-3 bg-gray-900 rounded-xl border border-gray-800">
                    <img src="${item.thumbnail}" class="w-16 h-16 rounded-lg object-cover bg-gray-800" onerror="this.src='https://via.placeholder.com/100?text=No+Thumb'">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-white truncate">${escapeHtml(item.title)}</p>
                        <p class="text-xs text-gray-400 truncate">${escapeHtml(item.artist)}</p>
                    </div>
                    <button data-videoid="${item.videoId}" 
                            data-title="${escapeHtml(item.title)}" 
                            data-artist="${escapeHtml(item.artist)}" 
                            data-thumb="${item.thumbnail}"
                            onclick="handleQueueClick(this)"
                            class="bg-gray-800 hover:bg-brand-600 text-brand-400 hover:text-white transition p-3 rounded-full flex-shrink-0">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            `).join('');
        }

        // Handles clicks safely from data attributes
        window.handleQueueClick = function(btn) {
            const videoId = btn.dataset.videoid;
            const title = btn.dataset.title;
            const artist = btn.dataset.artist;
            const thumbnail = btn.dataset.thumb;
            
            addToQueue(videoId, title, artist, thumbnail);
        };

        window.addToQueue = function(videoId, title, artist, thumbnail) {
            if (hostConnection && hostConnection.open) {
                hostConnection.send({
                    type: 'ADD_QUEUE',
                    track: { videoId, title, artist, thumbnail }
                });
                
                const searchInput = document.getElementById('search-input');
                const origPlaceholder = searchInput.placeholder;
                searchInput.value = "";
                searchInput.placeholder = "Added to Queue!";
                setTimeout(() => searchInput.placeholder = origPlaceholder, 2000);
            } else {
                alert("Not connected to Car System.");
            }
        };
    </script>
</body>
</html>
